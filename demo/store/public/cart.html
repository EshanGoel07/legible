<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart · Legible Demo Store</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><a href="/">Legible Demo Store</a><span>Cart</span></header>
  <main>
    <table><thead><tr><th>Item</th><th>Size</th><th class="right">Qty</th><th class="right">Price</th></tr></thead><tbody id="items"></tbody></table>
    <div class="row"><input id="code" placeholder="Coupon code (try DIWALI20)"><button id="apply">Apply</button></div>
    <div id="msg" class="msg"></div>
    <table class="totals"><tbody id="totals"></tbody></table>
    <div class="row totals"><button class="pay" id="pay">Pay with PayPal</button></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    const msg = (text, ok) => { $("msg").className = `msg ${ok ? "ok" : "bad"}`; $("msg").textContent = text; };
    async function api(path, opts = {}) {
      const r = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
      const body = await r.json();
      if (!r.ok) throw new Error(body.message || body.error || `HTTP ${r.status}`);
      return body;
    }
    const id = localStorage.getItem("cartId");
    function render(c) {
      $("items").innerHTML = c.items.length
        ? c.items.map((i) => `<tr><td>${esc(i.productId)}</td><td>${esc(i.size || "-")}</td><td class="right">${i.qty}</td><td class="right">$${esc(i.unitPrice)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="muted">Your cart is empty.</td></tr>`;
      const line = (k, v) => `<tr><td>${k}</td><td class="right">${v}</td></tr>`;
      $("totals").innerHTML = line("Subtotal", `$${c.subtotal}`) + line("Shipping", `$${c.shipping}`) +
        line(`Discount${c.coupon ? ` (${esc(c.coupon)})` : ""}`, `-$${c.discount}`) + line("<b>Total</b>", `<b>$${c.total} ${esc(c.currency)}</b>`);
      $("pay").disabled = !c.items.length;
    }
    async function load() {
      if (!id) return render({ items: [], subtotal: "0.00", shipping: "0.00", discount: "0.00", total: "0.00", currency: "USD", coupon: null });
      render(await api(`/api/cart/${id}`));
    }
    $("apply").onclick = async () => {
      try { render(await api(`/web/cart/${id}/coupon`, { method: "POST", body: JSON.stringify({ code: $("code").value }) })); msg("Coupon applied.", true); }
      catch (e) { msg(e.message, false); }
    };
    $("pay").onclick = async () => {
      $("pay").disabled = true;
      try {
        const c = await api(`/api/cart/${id}/checkout`, { method: "POST" });
        if (c.status === "BLOCKED_LIMIT") return msg(`Blocked: $${c.amount} is over the spending limit.`, false);
        localStorage.removeItem("cartId");
        location.href = c.approvalUrl;
      } catch (e) { msg(e.message, false); $("pay").disabled = false; }
    };
    load().catch((e) => msg(e.message, false));
  </script>
</body>
</html>
